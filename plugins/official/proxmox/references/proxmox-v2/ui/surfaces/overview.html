<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proxmox Overview</title>
<style>:root{color-scheme:light dark;font:14px/1.5 system-ui,sans-serif}body{margin:0;padding:18px;background:transparent;color:CanvasText}header{display:flex;justify-content:space-between;gap:12px}h1{margin:0;font-size:1.25rem}small{color:GrayText}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0}.stat{padding:12px;border:1px solid ButtonBorder;border-radius:8px}.stat strong{display:block;font-size:1.35rem}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid ButtonBorder}@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><header><div><h1>Proxmox</h1><small id="profile">No connection selected</small></div></header><section class="stats"><div class="stat"><strong id="nodes">—</strong>Nodes</div><div class="stat"><strong id="online">—</strong>Online</div><div class="stat"><strong id="guests">—</strong>Guests</div><div class="stat"><strong id="running">—</strong>Running</div></section><table><thead><tr><th>Guest</th><th>Type</th><th>Node</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="4">Waiting for NAD…</td></tr></tbody></table>
<script>let p,s='',n=0;const id=()=>`proxmox_${String(++n).padStart(8,'0')}`;const send=(type,payload)=>p?.postMessage({bridgeVersion:2,sessionId:s,messageId:id(),type,payload});const rowMessage=text=>{const row=document.createElement('tr');const cell=document.createElement('td');cell.colSpan=4;cell.textContent=text;row.append(cell);rows.replaceChildren(row)};const guestRow=g=>{const row=document.createElement('tr');for(const value of [g.name,g.type,g.node,g.status]){const cell=document.createElement('td');cell.textContent=String(value??'');row.append(cell)}return row};addEventListener('message',e=>{if(e.data?.type!=='nad.ui.connect'||e.data.bridgeVersion!==2||typeof e.data.sessionId!=='string'||!/^[A-Za-z0-9_-]{22,128}$/.test(e.data.sessionId)||e.ports.length!==1)return;p=e.ports[0];s=e.data.sessionId;p.onmessage=({data})=>{if(data?.type==='binding.result'&&data.payload?.binding==='overview'){const r=data.payload.result??{};profile.textContent=String(r.profile??'Unknown');nodes.textContent=String(r.nodeCount??0);online.textContent=String(r.onlineNodes??0);guests.textContent=String(r.guestCount??0);running.textContent=String(r.runningGuests??0);const items=Array.isArray(r.guests)?r.guests:[];items.length?rows.replaceChildren(...items.map(guestRow)):rowMessage('No guests visible.')}if(data?.type==='binding.error'||data?.type==='access.revoked')rowMessage('This surface is unavailable.')};send('surface.ready',{});send('binding.invoke',{binding:'overview',input:{}})});</script></body></html>

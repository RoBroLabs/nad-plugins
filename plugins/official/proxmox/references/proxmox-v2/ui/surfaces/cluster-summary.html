<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proxmox Cluster</title><style>:root{color-scheme:light dark;font:14px/1.45 system-ui,sans-serif}body{margin:0;padding:16px;background:transparent;color:CanvasText}h1{margin:0 0 5px;font-size:1rem}small{color:GrayText}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.grid div{padding:9px;border:1px solid ButtonBorder;border-radius:7px}.grid strong{display:block;font-size:1.25rem}</style></head>
<body><h1 id="profile">Proxmox</h1><small id="state">Waiting for NAD…</small><div class="grid"><div><strong id="nodes">—</strong>Nodes</div><div><strong id="guests">—</strong>Guests</div></div><script>let p,s='',n=0;const send=(type,payload)=>p?.postMessage({bridgeVersion:2,sessionId:s,messageId:`cluster_${String(++n).padStart(8,'0')}`,type,payload});addEventListener('message',e=>{if(e.data?.type!=='nad.ui.connect'||e.data.bridgeVersion!==2||typeof e.data.sessionId!=='string'||!/^[A-Za-z0-9_-]{22,128}$/.test(e.data.sessionId)||e.ports.length!==1)return;p=e.ports[0];s=e.data.sessionId;p.onmessage=({data})=>{if(data?.type==='binding.result'&&data.payload?.binding==='overview'){const r=data.payload.result??{};profile.textContent=`Proxmox · ${String(r.profile??'Unknown')}`;state.textContent=`${String(r.onlineNodes??0)} online · ${String(r.runningGuests??0)} guests running`;nodes.textContent=String(r.nodeCount??0);guests.textContent=String(r.guestCount??0)}if(data?.type==='binding.error'||data?.type==='access.revoked')state.textContent='Unavailable'};send('surface.ready',{});send('binding.invoke',{binding:'overview',input:{}})});</script></body></html>

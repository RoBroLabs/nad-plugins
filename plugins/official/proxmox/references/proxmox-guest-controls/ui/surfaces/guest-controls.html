<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proxmox Guest Controls</title><style>:root{color-scheme:light dark;font:14px/1.45 system-ui,sans-serif}body{margin:0;padding:14px;background:transparent;color:CanvasText}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:1rem}small{color:GrayText}.guest{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid ButtonBorder}.actions{display:flex;gap:5px}button{padding:5px 8px;border:1px solid ButtonBorder;border-radius:5px}</style></head>
<body><header><div><h1>Guest Controls</h1><small id="profile">Waiting for NAD…</small></div></header><main id="list"></main><script>let p,s='',n=0;const send=(type,payload)=>p?.postMessage({bridgeVersion:2,sessionId:s,messageId:`controls_${String(++n).padStart(8,'0')}`,type,payload});const load=()=>send('binding.invoke',{binding:'guests',input:{}});addEventListener('message',e=>{if(e.data?.type!=='nad.ui.connect'||e.data.bridgeVersion!==2||typeof e.data.sessionId!=='string'||!/^[A-Za-z0-9_-]{22,128}$/.test(e.data.sessionId)||e.ports.length!==1)return;p=e.ports[0];s=e.data.sessionId;p.onmessage=({data})=>{if(data?.type==='binding.result'&&data.payload?.binding==='guests'){const r=data.payload.result??{};profile.textContent=String(r.profile??'Unknown connection');list.replaceChildren(...(r.guests??[]).map(g=>{const row=document.createElement('section');row.className='guest';const label=document.createElement('span');label.textContent=`${String(g.name)} · ${String(g.status)}`;const actions=document.createElement('span');actions.className='actions';for(const action of ['start','stop','restart']){const button=document.createElement('button');button.type='button';button.textContent=action;button.onclick=()=>send('binding.invoke',{binding:'guest-action',input:{action,node:g.node,type:g.type,vmid:g.vmid}});actions.append(button)}row.append(label,actions);return row}))}if(data?.type==='binding.result'&&data.payload?.binding==='guest-action')load();if(data?.type==='binding.error'||data?.type==='access.revoked'){profile.textContent='This App connection is unavailable.';list.replaceChildren()}};send('surface.ready',{});load()});</script></body></html>
